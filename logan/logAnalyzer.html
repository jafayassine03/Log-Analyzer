<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Analyzer</title>
<link rel="stylesheet" href="loganz.css">
</head>
<body>

<div class="container">
    <h1>Log Analyzer</h1>
    <input type="file" id="fileInput" accept=".log,.txt">
    <input type="text" id="searchBox" placeholder="Search logs...">

    <div class="stats">
        <div class="card">
            <h2 id="totalLogs">0</h2>
            <p>Total Lines</p>
        </div>
        <div class="card">
            <h2 id="infoCount">0</h2>
            <p>INFO</p>
        </div>
        <div class="card">
            <h2 id="warningCount">0</h2>
            <p>WARNING</p>
        </div>
        <div class="card">
            <h2 id="errorCount">0</h2>
            <p>ERROR</p>
        </div>
    </div>

    <div class="actions">
        <button id="showAll">Show All</button>
        <button id="showInfo">INFO</button>
        <button id="showWarnings">WARNING</button>
        <button id="showErrors">ERROR</button>
        <button id="exportLogs">Export Logs</button>
    </div>

    <div class="logs" id="logs">
        Upload a log file to begin analysis.
    </div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const searchBox = document.getElementById("searchBox");
const logsDiv = document.getElementById("logs");
const totalLogs = document.getElementById("totalLogs");
const infoCount = document.getElementById("infoCount");
const warningCount = document.getElementById("warningCount");
const errorCount = document.getElementById("errorCount");
const showAll = document.getElementById("showAll");
const showInfo = document.getElementById("showInfo");
const showWarnings = document.getElementById("showWarnings");
const showErrors = document.getElementById("showErrors");
const exportLogs = document.getElementById("exportLogs");

let allLogs = [];
let currentLogs = [];

function displayLogs(lines) {
    currentLogs = [...lines];
    logsDiv.innerHTML = "";

    if (lines.length === 0) {
        logsDiv.textContent = "No matching log entries found.";
        return;
    }

    lines.forEach(line => {
        const div = document.createElement("div");
        div.textContent = line;
        const upper = line.toUpperCase();

        if (upper.includes("ERROR")) {
            div.classList.add("error");
        } else if (upper.includes("WARNING")) {
            div.classList.add("warning");
        } else if (upper.includes("INFO")) {
            div.classList.add("info");
        }

        logsDiv.appendChild(div);
    });
}

function updateStats(lines) {
    let info = 0;
    let warning = 0;
    let error = 0;

    lines.forEach(line => {
        const upper = line.toUpperCase();

        if (upper.includes("ERROR")) {
            error++;
        } else if (upper.includes("WARNING")) {
            warning++;
        } else if (upper.includes("INFO")) {
            info++;
        }
    });

    totalLogs.textContent = lines.length;
    infoCount.textContent = info;
    warningCount.textContent = warning;
    errorCount.textContent = error;
}

fileInput.addEventListener("change", function () {
    const file = this.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function (e) {
        const content = e.target.result;
        allLogs = content
            .split("\n")
            .filter(line => line.trim() !== "");

        updateStats(allLogs);
        displayLogs(allLogs);
    };
    reader.readAsText(file);
});

searchBox.addEventListener("input", () => {
    const term = searchBox.value.toLowerCase();
    const filtered = allLogs.filter(line =>
        line.toLowerCase().includes(term)
    );
    displayLogs(filtered);
});

showAll.addEventListener("click", () => {
    displayLogs(allLogs);
});

showInfo.addEventListener("click", () => {
    const filtered = allLogs.filter(line =>
        line.toUpperCase().includes("INFO")
    );
    displayLogs(filtered);
});

showWarnings.addEventListener("click", () => {
    const filtered = allLogs.filter(line =>
        line.toUpperCase().includes("WARNING")
    );
    displayLogs(filtered);
});

showErrors.addEventListener("click", () => {
    const filtered = allLogs.filter(line =>
        line.toUpperCase().includes("ERROR")
    );
    displayLogs(filtered);
});

exportLogs.addEventListener("click", () => {
    if (currentLogs.length === 0) return;

    const blob = new Blob([currentLogs.join("\n")], {
        type: "text/plain"
    });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "filtered_logs.txt";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
});
</script>
<script src="logan.js"></script>
</body>
</html>
