<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Analyzer</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #111827;
    color: white;
    margin: 0;
    padding: 20px;
}

.container {
    max-width: 900px;
    margin: auto;
}

h1 {
    text-align: center;
}

input[type="file"] {
    margin: 20px 0;
}

.stats {
    display: flex;
    gap: 15px;
    margin-bottom: 20px;
}

.card {
    flex: 1;
    background: #1f2937;
    padding: 15px;
    border-radius: 10px;
    text-align: center;
}

.logs {
    background: #1f2937;
    padding: 15px;
    border-radius: 10px;
    height: 400px;
    overflow-y: auto;
    white-space: pre-wrap;
}

.error {
    color: #ef4444;
}

.warning {
    color: #f59e0b;
}

.info {
    color: #10b981;
}
</style>
</head>
<body>

<div class="container">
    <h1>Log Analyzer</h1>

    <input type="file" id="fileInput">

    <div class="stats">
        <div class="card">
            <h2 id="totalLogs">0</h2>
            <p>Total Lines</p>
        </div>

        <div class="card">
            <h2 id="infoCount">0</h2>
            <p>INFO</p>
        </div>

        <div class="card">
            <h2 id="warningCount">0</h2>
            <p>WARNING</p>
        </div>

        <div class="card">
            <h2 id="errorCount">0</h2>
            <p>ERROR</p>
        </div>
    </div>

    <div class="logs" id="logs"></div>
</div>

<script>
const fileInput = document.getElementById("fileInput");
const logsDiv = document.getElementById("logs");

const totalLogs = document.getElementById("totalLogs");
const infoCount = document.getElementById("infoCount");
const warningCount = document.getElementById("warningCount");
const errorCount = document.getElementById("errorCount");

fileInput.addEventListener("change", function () {
    const file = this.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function (e) {
        const content = e.target.result;
        const lines = content.split("\n");

        let info = 0;
        let warning = 0;
        let error = 0;

        logsDiv.innerHTML = "";

        lines.forEach(line => {
            const div = document.createElement("div");
            div.textContent = line;

            if (line.toUpperCase().includes("ERROR")) {
                error++;
                div.classList.add("error");
            } else if (line.toUpperCase().includes("WARNING")) {
                warning++;
                div.classList.add("warning");
            } else if (line.toUpperCase().includes("INFO")) {
                info++;
                div.classList.add("info");
            }

            logsDiv.appendChild(div);
        });

        totalLogs.textContent = lines.length;
        infoCount.textContent = info;
        warningCount.textContent = warning;
        errorCount.textContent = error;
    };

    reader.readAsText(file);
});
</script>

</body>
</html>
